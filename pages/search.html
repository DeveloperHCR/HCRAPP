<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="A simple DeveloperHCR search page powered by Google Search.">
    <title>DeveloperHCR Engine</title>
    <style>
:root {
  color-scheme: dark;
  --page-bg: #07131f;
  --surface: rgba(10, 23, 36, 0.88);
  --text: #eef6ff;
  --muted: #9fb7c8;
  --accent: #67e8f9;
  --border: rgba(148, 163, 184, 0.22);
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(103, 232, 249, 0.12), transparent 42%),
    linear-gradient(145deg, #020b12, var(--page-bg) 55%, #10102a);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}
body.light-mode {
  color-scheme: light;
  --page-bg: #edf4fa;
  --surface: rgba(255, 255, 255, 0.9);
  --text: #15283b;
  --muted: #52677d;
  --accent: #087f9d;
  --border: rgba(31, 57, 82, 0.18);
  --shadow: 0 24px 60px rgba(36, 61, 84, 0.14);
  background:
    radial-gradient(ellipse at 50% 35%, rgba(8, 145, 178, 0.1), transparent 42%),
    linear-gradient(145deg, #ffffff, #edf4fa 55%, #f8fbff);
}
button, input { font: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.engine-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(1120px, calc(100% - 2rem));
  height: 76px;
  margin: 0 auto;
}
.engine-brand { display: inline-flex; align-items: center; gap: 0.7rem; font-weight: 700; letter-spacing: 0.03em; }
.engine-mark {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  color: var(--accent);
}
.menu-wrap { position: relative; }
.menu-button {
  width: 44px;
  height: 44px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-size: 1.65rem;
  line-height: 1;
}
.menu-button:hover, .menu-button:focus-visible { border-color: var(--accent); outline: none; }
.engine-menu {
  position: absolute;
  z-index: 2;
  top: calc(100% + 0.6rem);
  right: 0;
  min-width: 170px;
  padding: 0.45rem;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.engine-menu a { display: block; padding: 0.65rem 0.8rem; border-radius: 9px; text-decoration: none; }
.engine-menu a:hover, .engine-menu a:focus-visible { background: rgba(103, 232, 249, 0.12); color: var(--accent); outline: none; }
main {
  display: grid;
  min-height: calc(100vh - 76px);
  min-height: calc(100svh - 76px);
  place-items: center;
  padding: 1.5rem 1rem 5rem;
}
.search-panel { width: min(760px, 100%); text-align: center; }
.search-panel h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 5rem); letter-spacing: -0.055em; line-height: 1.1; }
.search-panel h1 span { color: var(--accent); }
.search-panel p { margin: 1rem 0 2rem; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.15rem); }
.search-form {
  display: flex;
  gap: 0.6rem;
  padding: 0.55rem;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.search-form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.12), var(--shadow); }
.search-form input {
  flex: 1;
  min-width: 0;
  padding: 0.9rem 1rem;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 1rem;
}
.search-form button {
  padding: 0.8rem 1.2rem;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #04151d;
  cursor: pointer;
  font-weight: 700;
}
.search-form button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.search-note { display: block; margin-top: 1rem; color: var(--muted); font-size: 0.82rem; }
@media (max-width: 520px) {
  .search-form { flex-direction: column; }
  .search-form button { min-height: 48px; }
}
@media (prefers-reduced-motion: no-preference) {
  .search-panel { animation: arrive 0.55s ease-out both; }
  @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
}
    </style>
</head>
<body>
    <header class="engine-header">
        <div class="engine-brand"><span class="engine-mark" aria-hidden="true">DH</span><span>DeveloperHCR</span></div>
        <div class="menu-wrap">
            <button class="menu-button" id="engine-menu-button" type="button" aria-label="More options" aria-controls="engine-menu" aria-expanded="false"><span aria-hidden="true">⋮</span></button>
            <nav class="engine-menu" id="engine-menu" aria-label="Page menu" hidden>
                <a href="../index.html">Back to Home</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="search-panel" aria-labelledby="engine-title">
            <h1 id="engine-title">DeveloperHCR <span>Engine</span></h1>
            <p>A simple place to search the web with Google.</p>
            <form class="search-form" action="https://www.google.com/search" method="get" role="search">
                <label class="sr-only" for="engine-query">Search the web</label>
                <input id="engine-query" type="search" name="q" placeholder="Search the web" autocomplete="off" required>
                <button type="submit">Search</button>
            </form>
            <small class="search-note">Search terms are sent directly to Google.</small>
        </section>
    </main>
    <script src="../js/search.js?v=20261116-engine"></script>
</body>
</html>
