<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backend Status | DeveloperHCR</title>
  <style>
:root {
  --bg: #07131f;
  --panel: rgba(10, 20, 30, 0.8);
  --panel-strong: #0a1724;
  --card: rgba(13, 27, 40, 0.9);
  --text: #eef6ff;
  --muted: #9fb7c8;
  --primary: #67e8f9;
  --secondary: #8b5cf6;
  --accent: #f59e0b;
  --success: #34d399;
  --border: rgba(148, 163, 184, 0.18);
  --shadow: 0 20px 50px rgba(15, 23, 42, 0.65);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, rgba(103, 232, 249, 0.12), transparent 35%),
    linear-gradient(135deg, #020b12, #0b1724 35%, #07131f);
  color: var(--text);
  line-height: 1.6;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
.container { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; }
.glass-panel, .project-card, .info-card, .panel {
  background: rgba(11, 18, 27, 0.8);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
}
.site-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(7, 19, 31, 0.8);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(18px);
}
.nav-container {
  width: min(1200px, calc(100% - 2rem));
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 76px;
  gap: 1rem;
}
.brand-logo a {
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
  font-size: clamp(1.2rem, 2vw, 2rem);
  font-weight: 700;
  letter-spacing: 0.04em;
}
.site-logo {
  width: 42px;
  height: 42px;
  object-fit: cover;
  border: 1px solid rgba(103, 232, 249, 0.35);
  border-radius: 50%;
}
.brand-logo span { color: var(--primary); }
.language-picker {
  display: flex;
  align-items: center;
  margin: 0;
  color: var(--muted);
}
.language-select {
  width: auto;
  min-width: 108px;
  padding: 0.6rem 0.7rem;
  cursor: pointer;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.main-nav ul {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 0; margin: 0;
  flex-wrap: wrap;
}
.main-nav a {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.6rem 0.8rem;
  border-radius: 999px;
  color: #dfeaf5;
  transition: 0.25s ease;
  font-size: 0.95rem;
}
.main-nav a:hover,
.main-nav a.active {
  background: rgba(103, 232, 249, 0.12);
  color: var(--primary);
}
.admin-btn {
  border: 1px solid rgba(103, 232, 249, 0.25);
  background: rgba(103, 232, 249, 0.08);
}
.hero-section, .page-banner {
  padding: 4.5rem 0 2.5rem;
}
.hero-section {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 2rem;
  align-items: center;
  width: min(1200px, calc(100% - 2rem));
  margin: 0 auto;
}
.hero-content h1 {
  font-size: clamp(2.2rem, 4vw, 4.3rem);
  line-height: 1.08;
  margin: 0 0 1rem;
}
.highlight { color: var(--primary); }
.hero-content p, .intro-text, .page-copy {
  font-size: 1.1rem;
  color: var(--muted);
  margin-bottom: 1.5rem;
}
.hero-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 1.5rem;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.9rem 1.3rem;
  font-weight: 700;
  border-radius: 12px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary {
  background: linear-gradient(135deg, var(--primary), #38bdf8);
  color: #04151d;
  box-shadow: 0 12px 30px rgba(56, 189, 248, 0.35);
}
.btn-secondary {
  background: rgba(139, 92, 246, 0.12);
  border: 1px solid rgba(139, 92, 246, 0.3);
}
.glass-panel {
  border-radius: 20px;
  padding: 1.2rem;
}
.hero-artwork .glass-panel {
  padding: 1rem;
  position: relative;
}
.artwork-img {
  width: 100%;
  min-height: 360px;
  object-fit: cover;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08);
}
.neon-badge {
  position: absolute; right: 2rem; bottom: 2rem;
  padding: 0.6rem 1rem; border-radius: 999px;
  background: rgba(52, 211, 153, 0.15); color: var(--success);
  border: 1px solid rgba(52, 211, 153, 0.35); font-weight: 700;
}
section { padding: 2rem 0; }
.intro-section, .projects-preview, .page-content {
  width: min(1200px, calc(100% - 2rem));
  margin: 0 auto;
}
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: 1.5rem;
  margin-top: 1.5rem;
}
.info-grid, .feature-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.5rem;
  margin-top: 1.5rem;
}
.project-card, .info-card {
  padding: 1.5rem;
  border-radius: 18px;
  min-height: 220px;
}
.project-card h3, .info-card h3 { margin-top: 0; }
.project-link {
  display: inline-block;
  margin-top: 1rem;
  color: var(--primary);
  font-weight: 700;
}
.site-footer {
  border-top: 1px solid var(--border);
  background: rgba(2, 8, 12, 0.8);
  margin-top: 3rem;
}
.footer-content {
  width: min(1200px, calc(100% - 2rem));
  margin: 0 auto;
  padding: 2rem 0 1rem;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}
.footer-links ul {
  list-style: none; padding: 0; margin: 0;
}
.footer-links li + li { margin-top: 0.5rem; }
.footer-bottom {
  text-align: center;
  padding: 1.1rem 0 1.5rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
}
.page-banner {
  background: linear-gradient(135deg, rgba(103, 232, 249, 0.08), rgba(139, 92, 246, 0.08));
  border-bottom: 1px solid var(--border);
}
.page-content {
  padding-top: 2rem;
}
.page-copy {
  max-width: 800px;
}
.info-card ul { margin: 0; padding-left: 1.1rem; color: var(--muted); }
.panel {
  border-radius: 18px;
  padding: 1.5rem;
  margin-top: 1.5rem;
}
.form-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}
label { display: block; margin-bottom: 0.5rem; color: var(--muted); }
input, textarea, select, button {
  font: inherit;
}
input, textarea, select {
  width: 100%;
  padding: 0.9rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(15, 23, 42, 0.8);
  color: var(--text);
}
textarea { min-height: 130px; resize: vertical; }
.muted { color: var(--muted); }
.menu-toggle { display: none; }
@media (max-width: 860px) {
  .hero-section, .project-grid, .feature-grid, .info-grid, .footer-content, .form-row {
    grid-template-columns: 1fr;
  }
  .menu-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer;
  }
  .main-nav {
    position: absolute;
    top: 76px; left: 1rem; right: 1rem;
    display: none;
    background: rgba(7, 19, 31, 0.95); border: 1px solid var(--border); border-radius: 16px; padding: 0.75rem;
  }
  .main-nav.open { display: block; }
  .main-nav ul { flex-direction: column; align-items: stretch; }
  .main-nav a { justify-content: center; }
}
@media (max-width: 480px) {
  .nav-container { gap: 0.45rem; }
  .brand-logo a { font-size: 1rem; gap: 0.4rem; }
  .site-logo { width: 34px; height: 34px; }
  .language-select { min-width: 78px; padding: 0.55rem 0.4rem; }
  .menu-toggle { width: 38px; height: 38px; }
}
</style>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .status-box {
      max-width: 720px; width: min(90vw, 720px);
      padding: 2rem; border-radius: 20px;
      background: rgba(7, 19, 31, 0.8); border: 1px solid rgba(103,232,249,0.3);
      box-shadow: 0 20px 50px rgba(12, 30, 45, 0.6);
      text-align: center;
    }
    .status-box h1 { margin: 0 0 12px; color: #fbbf24; }
    .status-box p { margin: 0 0 20px; color: #dbeafe; }
    .status-box a {
      display: inline-block; padding: 0.9rem 1.4rem; border-radius: 12px;
      background: linear-gradient(135deg, #67e8f9, #38bdf8); color: #02131d; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="status-box">
    <h1>Data is working...</h1>
    <p>The backend endpoint is responding and the site is ready to continue.</p>
    <a href="../index.html">Return to Home</a>
  </div>
</body>
</html>
