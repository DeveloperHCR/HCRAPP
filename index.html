<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCR App - Location & Device Info</title>
<style>
body{background:#101827;color:white;font-family:Arial;text-align:center;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px;max-width:500px;margin:auto}
button{padding:12px;margin:6px;border:0;border-radius:8px;background:#00d9ff;color:#00111a;font-weight:bold}
pre{white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}
</style>
</head>
<body>
<div class="card">
<h2>📍 HCR Location & Data</h2>
<p>Location access requires your permission.</p>
<button onclick="getLocation()">Open My Location</button>
<button onclick="getInfo()">Collect Device Info</button>
<button onclick="copyData()">Copy Data</button>
<pre id="result">No data collected yet.</pre>
</div>
<script>
let data={};
function getLocation(){
 if(!navigator.geolocation){alert("Location unavailable");return}
 navigator.geolocation.getCurrentPosition(p=>{
 data.latitude=p.coords.latitude;
 data.longitude=p.coords.longitude;
 data.accuracy_meters=p.coords.accuracy;
 document.getElementById("result").textContent=JSON.stringify(data,null,2);
 window.open("https://www.google.com/maps?q="+data.latitude+","+data.longitude,"_blank");
 },e=>alert("Location permission denied or unavailable."),
 {enableHighAccuracy:true,timeout:15000});
}
function getInfo(){
 data.browser=navigator.userAgent;
 data.language=navigator.language;
 data.screen=screen.width+" x "+screen.height;
 data.timezone=Intl.DateTimeFormat().resolvedOptions().timeZone;
 data.platform=navigator.platform;
 data.online=navigator.onLine;
 data.collectedAt=new Date().toISOString();
 document.getElementById("result").textContent=JSON.stringify(data,null,2);
}
async function copyData(){
 try{
 await navigator.clipboard.writeText(JSON.stringify(data,null,2));
 alert("Data copied!");
 }catch(e){alert("Collect data first, then try copying on HTTPS.")}
}
</script>
</body>
</html>
