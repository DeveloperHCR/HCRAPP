<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1b">
    <meta name="description" content="DeveloperHCR HCRAPP — Explore DevX OS, web applications, developer tools, project information, and system diagnostics.">
    <title>DeveloperHCR | HCRAPP</title>

    <style>
        :root {
            --bg: #080d1b;
            --card: #101a30;
            --blue: #4388ff;
            --cyan: #00e5ff;
            --green: #20e59a;
            --red: #ff5b6e;
            --text: #f4f7ff;
            --muted: #9aaac5;
            --border: rgba(255,255,255,.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 85px;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        /* STARTUP / WEBSITE DIAGNOSTICS */

        #startup {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: #050916;
            transition: opacity .45s ease, visibility .45s ease;
        }

        #startup.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .startup-logo {
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
            border-radius: 23px;
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            box-shadow: 0 0 45px #4388ff55;
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        #startup h1 {
            font-size: 27px;
            text-align: center;
        }

        #startup .subtitle {
            margin-top: 6px;
            margin-bottom: 24px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        .progress-track {
            width: min(340px, 85vw);
            height: 6px;
            background: #1a2840;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--cyan));
            transition: width .1s linear;
        }

        #loading-status {
            color: var(--cyan);
            font-size: 12px;
            margin-top: 13px;
            text-align: center;
        }

        .checks {
            width: min(340px, 85vw);
            margin-top: 20px;
        }

        .check-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 5px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .check-value {
            color: #ffcf70;
            text-align: right;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(8,13,27,.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .navbar {
            max-width: 1180px;
            min-height: 72px;
            margin: auto;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 18px;
            white-space: nowrap;
        }

        .brand-icon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue), var(--cyan));
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: var(--muted);
            font-size: 12px;
            transition: color .2s;
        }

        nav a:hover {
            color: var(--cyan);
        }

        .menu-btn {
            display: none;
            padding: 8px 12px;
            background: var(--card);
            color: white;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        /* COMMON */

        .container {
            max-width: 1180px;
            padding: 0 22px;
            margin: auto;
        }

        section {
            padding: 75px 0;
        }

        .section-heading {
            text-align: center;
            margin-bottom: 38px;
        }

        .section-heading h2 {
            font-size: clamp(26px, 4vw, 38px);
            line-height: 1.25;
            margin-bottom: 12px;
        }

        .section-heading p {
            max-width: 650px;
            margin: auto;
            color: var(--muted);
            font-size: 14px;
        }

        .gradient-text {
            color: var(--cyan);
            background: linear-gradient(90deg, #5796ff, var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-radius: 10px;
            padding: 12px 17px;
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 13px;
            transition: transform .2s, opacity .2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(100deg, #4388ff, #2864e9);
            color: white;
            border: none;
        }

        .btn-secondary {
            background: var(--card);
            color: white;
        }

        .card {
            background: linear-gradient(145deg, #111d34, #0c1426);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 23px;
            transition: border-color .2s, transform .2s;
        }

        .card:hover {
            border-color: #4388ff88;
            transform: translateY(-3px);
        }

        .icon {
            width: 47px;
            height: 47px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: #19345a;
            font-size: 22px;
            margin-bottom: 17px;
        }

        .muted {
            color: var(--muted);
        }

        /* HERO */

        .hero {
            padding: 85px 0 70px;
            background:
                radial-gradient(ellipse at 80% 20%, #124b8030, transparent 42%),
                radial-gradient(ellipse at 10% 80%, #1748a01c, transparent 40%);
        }

        .hero-layout {
            display: grid;
            grid-template-columns: 1.35fr .85fr;
            align-items: center;
            gap: 50px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            background: #122747;
            border: 1px solid #28476e;
            border-radius: 30px;
            color: #9bdcff;
            font-size: 12px;
            margin-bottom: 24px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 10px #20e59a88;
        }

        .hero h1 {
            font-size: clamp(38px, 5.5vw, 65px);
            line-height: 1.1;
            letter-spacing: -1.7px;
            margin-bottom: 22px;
        }

        .hero-description {
            max-width: 630px;
            font-size: 15px;
            line-height: 1.9;
            color: var(--muted);
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .hero-note {
            margin-top: 20px;
            font-size: 11px;
            color: var(--muted);
        }

        .dashboard {
            background: rgba(16,26,48,.86);
            border: 1px solid #2a4164;
            border-radius: 20px;
            padding: 23px;
            box-shadow: 0 20px 70px #00000030;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin-bottom: 22px;
        }

        .dashboard-header h3 {
            font-size: 15px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #103b32;
            color: var(--green);
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: var(--muted);
        }

        .metric-value {
            color: var(--green);
            text-align: right;
        }

        .dashboard-foot {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            background: #0a1428;
            color: var(--muted);
            font-size: 11px;
        }

        /* STATUS CARDS */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat-card {
            padding: 20px;
            border-radius: 14px;
            background: var(--card);
            border: 1px solid var(--border);
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--muted);
        }

        .stat-card .stat-number {
            font-size: 23px;
            font-weight: 800;
            margin-top: 8px;
        }

        /* FEATURES */

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .card h3 {
            font-size: 17px;
            margin-bottom: 9px;
        }

        .card p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        /* ABOUT */

        .about-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: start;
            gap: 30px;
        }

        .about-copy h3 {
            font-size: 24px;
            margin-bottom: 16px;
        }

        .about-copy p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.95;
            margin-bottom: 14px;
        }

        .about-list {
            list-style: none;
            margin-top: 17px;
        }

        .about-list li {
            margin: 12px 0;
            font-size: 13px;
            color: #d9e6ff;
        }

        .about-list li::before {
            content: "✓";
            color: var(--green);
            font-weight: bold;
            margin-right: 10px;
        }

        /* DIAGNOSTICS */

        .diagnostic-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
        }

        .diagnostic-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .diagnostic-heading h3 {
            font-size: 18px;
        }

        .diagnostic-list {
            list-style: none;
        }

        .diagnostic-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .diagnostic-list li:last-child {
            border-bottom: none;
        }

        .diag-status {
            color: var(--green);
            font-size: 12px;
            text-align: right;
        }

        .diag-status.warning {
            color: #ffcf70;
        }

        .diag-status.error {
            color: var(--red);
        }

        .diagnostic-note {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background: #0a1428;
            color: var(--muted);
            font-size: 12px;
        }

        /* PROJECTS */

        .project-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        /* FAQ */

        .faq-list {
            max-width: 800px;
            margin: auto;
        }

        details {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 17px 19px;
            margin-bottom: 12px;
        }

        summary {
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
        }

        details p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
            margin-top: 12px;
        }

        /* FOOTER */

        footer {
            padding: 35px 0;
            border-top: 1px solid var(--border);
            background: #060a15;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-content p {
            font-size: 12px;
            color: var(--muted);
        }

        .footer-links {
            display: flex;
            gap: 17px;
            flex-wrap: wrap;
        }

        .footer-links a {
            font-size: 12px;
            color: var(--muted);
        }

        .footer-links a:hover {
            color: var(--cyan);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 100000;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #31537c;
            background: #12213a;
            color: white;
            font-size: 13px;
            transition: .25s;
            width: max-content;
            max-width: 90vw;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 850px) {
            .hero-layout {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .dashboard {
                max-width: 550px;
                width: 100%;
            }

            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .about-layout {
                grid-template-columns: 1fr;
            }

            nav {
                display: none;
                position: absolute;
                top: 71px;
                left: 0;
                right: 0;
                padding: 20px;
                background: #0b1223;
                border-bottom: 1px solid var(--border);
                flex-direction: column;
                align-items: stretch;
                gap: 0;
            }

            nav.open {
                display: flex;
            }

            nav a {
                padding: 12px 4px;
                font-size: 14px;
            }

            .menu-btn {
                display: block;
            }
        }

        @media (max-width: 520px) {
            .container {
                padding: 0 17px;
            }

            .navbar {
                padding: 12px 17px;
            }

            .brand {
                font-size: 15px;
            }

            .hero {
                padding: 58px 0 45px;
            }

            .hero h1 {
                letter-spacing: -1px;
            }

            section {
                padding: 55px 0;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                gap: 10px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-card .stat-number {
                font-size: 19px;
            }

            .card {
                padding: 19px;
            }

            .diagnostic-panel {
                padding: 17px;
            }

            .footer-content {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- THREE-SECOND STARTUP AND BASIC CHECKS -->

    <div id="startup" role="status" aria-live="polite">
        <div class="startup-logo">HCR</div>
        <h1>DeveloperHCR</h1>
        <p class="subtitle">HCRAPP Website Initialization</p>

        <div class="progress-track">
            <div id="progress"></div>
        </div>

        <div id="loading-status">Initializing website... 0%</div>

        <div class="checks">
            <div class="check-row">
                <span>HTML document</span>
                <span class="check-value" id="check-html">Checking...</span>
            </div>
            <div class="check-row">
                <span>CSS styling</span>
                <span class="check-value" id="check-css">Checking...</span>
            </div>
            <div class="check-row">
                <span>JavaScript</span>
                <span class="check-value" id="check-js">Checking...</span>
            </div>
            <div class="check-row">
                <span>Website connection</span>
                <span class="check-value" id="check-network">Checking...</span>
            </div>
        </div>
    </div>

    <!-- HEADER -->

    <header>
        <div class="navbar">
            <a class="brand" href="#home" aria-label="DeveloperHCR home">
                <span class="brand-icon">HCR</span>
                <span>Developer<span class="gradient-text">HCR</span></span>
            </a>

            <nav id="navigation">
                <a href="#home">Home</a>
                <a href="#features">Features</a>
                <a href="#about">About</a>
                <a href="#diagnostics">Diagnostics</a>
                <a href="#projects">Projects</a>
                <a href="#faq">FAQ</a>
